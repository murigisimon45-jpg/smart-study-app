<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// Dynamic backend connection - NO HARDCODED KEYS
(function(){
  window.__SSA_DYN_CONN__ = {
    getConfig: function(){
      try{
        var env = window.__SSA_ENV__ || {};
        var url = env.SUPABASE_URL || env.VITE_SUPABASE_URL || window.SUPABASE_URL || window.__SUPABASE_URL__ || localStorage.getItem('ssa_supabase_url') || localStorage.getItem('supabase_url') || localStorage.getItem('VITE_SUPABASE_URL') || '';
        var anon = env.SUPABASE_ANON_KEY || env.VITE_SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY || window.__SUPABASE_ANON_KEY__ || localStorage.getItem('ssa_supabase_anon') || localStorage.getItem('supabase_anon_key') || localStorage.getItem('VITE_SUPABASE_ANON_KEY') || '';
        // Also try main app localStorage
        if(!url){
          try{
            var mainUrl = localStorage.getItem('ssa_users') ? null : null; // placeholder
          }catch{}
        }
        // Trim
        url = (url||'').trim(); anon = (anon||'').trim();
        // Default fallback to known project ONLY if user has previously connected (stored) - no hardcode in file
        return {url:url, anon:anon};
      }catch(e){ return {url:'', anon:''}; }
    },
    setConfig: function(url, anon){
      localStorage.setItem('ssa_supabase_url', url);
      localStorage.setItem('ssa_supabase_anon', anon);
      localStorage.setItem('supabase_url', url);
      localStorage.setItem('supabase_anon_key', anon);
    },
    createClient: function(url, anon){
      try{
        if(!url || !anon) return null;
        if(window.supabase && window.supabase.createClient){
          var client = window.supabase.createClient(url, anon);
          window.supabaseClient = client;
          window.__SSA_SUPABASE_CLIENT__ = client;
          window.__supabase__ = client;
          console.log('[Admin] Supabase connected dynamically to', url);
          return client;
        }
      }catch(e){ console.warn('[Admin] createClient failed', e); }
      return null;
    },
    init: function(){
      var cfg = this.getConfig();
      if(cfg.url && cfg.anon){
        this.createClient(cfg.url, cfg.anon);
        return true;
      }
      return false;
    }
  };
  window.__SSA_DYN_CONN__.init();
})();
</script>
